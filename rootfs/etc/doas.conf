# The last matching rule wins, so the general wheel rule comes first and the
# password-free ones for the home screen's own jobs come after it.
permit persist keepenv :wheel
permit nopass lifeboat as root cmd /usr/local/bin/lifeboat
permit nopass lifeboat as root cmd lifeboat
permit nopass lifeboat as root cmd pacman
permit nopass lifeboat as root cmd /usr/bin/pacman
# keepenv so the display variables survive: gparted is a gui program and
# without WAYLAND_DISPLAY / XDG_RUNTIME_DIR it cannot open a display
permit nopass keepenv lifeboat as root cmd gparted
permit nopass lifeboat as root cmd testdisk
permit nopass lifeboat as root cmd smartctl
permit nopass lifeboat as root cmd ddrescue
