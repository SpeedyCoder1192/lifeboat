# lifeboat settings. read at boot by init and afterwards by lifeboat itself.

# RAM_SIZE: how big the changes filesystem can get. It only takes the ram that
# is actually used, and the same size is what changes.img can grow to on the
# stick. 16G, 4096M or a share of ram like 50%.
RAM_SIZE=16G
# ZRAM_COMP: lz4 is fastest, zstd squeezes more in
ZRAM_COMP=lz4
# SPILL_PERCENT: ram use that moves the changes onto the stick, if it is in
SPILL_PERCENT=80
# WARN_PERCENT: ram use that asks for the stick when it is not in
WARN_PERCENT=75
# LOAD_PERCENT: after booting from saved changes, pull them into ram when they
# take less than this share of the free ram, so the stick can come out. 0 = never
LOAD_PERCENT=40
# USB_LABEL: label of the stick's data partition
USB_LABEL=LIFEBOAT
# LID: suspend or ignore
LID=suspend
# SYSTEM_IN_RAM: auto puts the system into ram when there is room for it
# (and all the drivers too when there's lots), always does it whenever it fits
# at all, never reads it off the stick, which then has to stay in.
SYSTEM_IN_RAM=auto
